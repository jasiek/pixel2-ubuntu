# Mainline ath10k (P8.3 wifi). No effect on 4.4 (no "ath" module there).
# Walleye's board data reports no country, so ath picks US and marks the wiphy
# REGULATORY_STRICT_REG. That path rewrites chan->orig_flags and wipes the DT
# ieee80211-freq-limit, so 5 GHz channels 169/173 come back. Walleye's WLAN
# firmware has no calibration for them: a scan pairing 165+169 crashes the
# WLAN PD (halphy_caldb.c:2822 Assertion 0 failed).
# 0x67 = WOR02_WORLD: a world SKU, no STRICT_REG, so the limit survives; the
# real country is learned from AP beacons (Porthole's taimen fix, Porthole patch
# in drivers/net/wireless/ath/regd.c).
options ath regd_override=0x67
