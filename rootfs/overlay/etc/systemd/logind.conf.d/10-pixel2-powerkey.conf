# Headless phone on a cable: a short power-key press must not power it off
# (systemd's default; with USB attached the bootloader then starts charger
# mode, so it looks like a spontaneous reboot -- test 54). A short press
# wakes the screen instead (pixel2-screen watches the key). Holding it 5 s
# powers off cleanly; ~10 s+ is the PMIC's own hard reset.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
