# Mainline kernel only (P8.3): on 4.4 the Android vendor daemons do this.
[Unit]
ConditionKernelVersion=>=5

[Service]
# The modem asks for /readwrite/ota_firewall/ruleset (readwrite root =
# /tmp/tqftpserv, on tmpfs). An empty file is what Porthole's taimen serves.
ExecStartPre=/bin/sh -c 'mkdir -p /tmp/tqftpserv/ota_firewall && touch /tmp/tqftpserv/ota_firewall/ruleset'
