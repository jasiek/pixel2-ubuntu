# Mainline kernel only (P8.3): on 4.4 the Android vendor daemons do this.
# rmtfs -s starts the modem (MSS remoteproc) once it serves, so everything the
# modem talks to at boot must already run: tqftpserv (config files) and
# diag-router (without it the modem's watchdog kills the WLAN PD).
[Unit]
ConditionKernelVersion=>=5
Wants=tqftpserv.service diag-router.service
After=tqftpserv.service diag-router.service
