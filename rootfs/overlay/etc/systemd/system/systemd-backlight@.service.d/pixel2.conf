# The OLED panel's brightness is a DCS command (panel-samsung-s6e3fa5). At boot
# pixel2-screen has already switched the panel off, so restoring the saved
# brightness fails with EINVAL and leaves the system "degraded". Nothing to
# save or restore here: pixel2-screen owns the panel.
[Service]
ExecStart=
ExecStart=/bin/true
ExecStop=
ExecStop=/bin/true
