# Never run the userspace QRTR name service: mainline has it in the kernel
# (since 5.7; a second one fails to bind), and 4.4 has no AF_QIPCRTR at all.
# A unit skipped by a Condition still lets rmtfs.service (Requires=qrtr-ns)
# start. The path never exists.
[Unit]
ConditionPathExists=/etc/pixel2/use-userspace-qrtr-ns
